name: Release

on:
  push:
    tags:
      # Deliberately one broad pattern rather than an enumerated list.
      # The previous two-pattern form silently skipped `.postN` tags
      # (issue #73): `.post1` has no `-` separator, so it matched neither
      # the exact-triple pattern nor the `-*` pre-release one, and the
      # whole release chain was skipped with no failing run to notice.
      # An enumerated list would drift again the first time we use a
      # PEP 440 form nobody listed, so anything starting with a vX.Y.Z
      # triple fires here and the pre-release question is decided below.
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # First, run the full test suite to gate the release
  test:
    name: "Test (${{ matrix.os }}, Python ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # seaborn is required by scripts/plot_heatmap.py.
        run: pip install nanobind numpy matplotlib seaborn pytest

      - name: Build and test
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          pip install -e .
          pytest tests/ -v --tb=short

  # Create GitHub release with auto-generated notes
  create-release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version and classify the release
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          # A full release is exactly X.Y.Z or X.Y.Z.postN — per PEP 440 a
          # post-release is a real release, and docs/publishing.md treats it
          # as a first-class flavor. Everything else (rc / a / b / dev, with
          # or without a separator) is a pre-release.
          #
          # This is not cosmetic: publish.yml keys off
          # `github.event.release.prerelease` to route wheels to TestPyPI
          # rather than PyPI. The old `contains(github.ref, '-')` test
          # would call `v1.2.3rc1` a full release and push a release
          # candidate straight to real PyPI, which cannot be undone.
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag v$VERSION -> prerelease=$PRERELEASE"

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "## Changes" > release_notes.md
          echo "" >> release_notes.md
          git log $RANGE --pretty=format:"- %s (%h)" --no-merges >> release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
